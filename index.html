  document.getElementById('list').innerHTML=cats.map(c=>{
    const a=g[c],p=sum(a.filter(r=>r[3]==='P')),n=sum(a.filter(r=>r[3]==='N'));
    const body=a.slice().sort((x,y)=>y[4]-x[4]).map(r=>`<tr${ov[r[6]]!==undefined?' class="chg"':''}><td>${r[1]}</td><td>${r[2]}</td><td>${nm[r[3]]}</td><td>${r[5]||'À vista'}</td><td class="num ${r[4]<0?'neg':''}">${f(r[4])}</td><td>${sel(r)}</td></tr>`).join('');
    return `<details data-c="${c}"${open.has(c)?' open':''}><summary><span class="nm">${c} <span class="cnt">(${a.length})</span></span><span class="num hide">${f(p)}</span><span class="num hide">${f(n)}</span><span class="num">${f(sum(a))}</span><span class="num hide">${(sum(a)/T*100).toFixed(1).replace('.',',')}%</span></summary><div class="tw"><table><thead><tr><th>Data</th><th>Estabelecimento</th><th>Portador</th><th>Parcela</th><th class="num">Valor</th><th>Mover para</th></tr></thead><tbody>${body}</tbody></table></div></details>`}).join('');
  const P=sum(rows.filter(r=>r[3]==='P')),N=sum(rows.filter(r=>r[3]==='N'));
  dash();const k=Object.keys(ov).length;document.getElementById('chgn').textContent=k?k+(k>1?' lançamentos reclassificados':' lançamento reclassificado'):'';
  document.getElementById('tot').innerHTML=`<div class="head"><span>Total (${rows.length} lançamentos)</span><span class="num hide">${f(P)}</span><span class="num hide">${f(N)}</span><span class="num">${f(T)}</span><span class="num hide">100%</span></div>`;
}
document.getElementById('all').onclick=()=>document.querySelectorAll('details').forEach(e=>e.open=true);
document.getElementById('none').onclick=()=>document.querySelectorAll('details').forEach(e=>e.open=false);

document.getElementById('list').addEventListener('change',e=>{const s=e.target;if(!s.matches('select[data-i]'))return;const i=+s.dataset.i;if(s.value===D[i][0])delete ov[i];else ov[i]=s.value;pend=s.value;sv();render()});
document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-t]').forEach(x=>x.setAttribute('aria-selected',x===b));document.getElementById('tab-cat').hidden=b.dataset.t!=='cat';document.getElementById('tab-dash').hidden=b.dataset.t!=='dash'});
function dash(){
const R=D.map((r,i)=>({c:gc(i),e:r[2],p:r[3],v:r[4],pc:r[5]}));
const S=a=>a.reduce((s,r)=>s+r.v,0),pc=(a,b)=>b?(a/b*100).toFixed(1).replace('.',',')+'%':'0%';
const Pr=R.filter(r=>r.p==='P'),Nr=R.filter(r=>r.p==='N'),T=S(R),P=S(Pr),N=S(Nr);
const by=a=>{const m={};a.forEach(r=>m[r.c]=(m[r.c]||0)+r.v);return Object.entries(m).sort((x,y)=>y[1]-x[1])};
const one=(it,col)=>{const mx=Math.max(...it.map(i=>i[1]),1);return it.map(([k,v])=>`<div class='br'><span>${k}</span><span class='bt'><i style='width:${Math.max(v,0)/mx*100}%;background:${col}'></i></span><span class='bv'>${f(v)}</span></div>`).join('')};
const all=by(R),mx=Math.max(...all.map(x=>x[1]),1);
const stack=all.map(([k])=>{const p=S(Pr.filter(r=>r.c===k)),n=S(Nr.filter(r=>r.c===k));return `<div class='br'><span>${k}</span><span class='bt'><i title='Paulo: ${f(p)}' style='width:${Math.max(p,0)/mx*100}%;background:var(--acc)'></i><i title='Natália: ${f(n)}' style='width:${Math.max(n,0)/mx*100}%;background:var(--n)'></i></span><span class='bv'>${f(p+n)}</span></div>`}).join('');
const par=R.filter(r=>r.pc).map(r=>{const [n,m]=r.pc.split(' de ').map(Number);return {...r,n,m}});
const pv=S(par),pP=S(par.filter(r=>r.p==='P')),pN=pv-pP;
const fut=par.reduce((s,r)=>s+r.v*(r.m-r.n),0),nw=par.filter(r=>r.n===1);
const g={};par.filter(r=>r.n<r.m).forEach(r=>{const k=r.e+'|'+r.pc;const o=g[k]=g[k]||{k:r.e,v:0,s:(r.m-r.n)+' parcelas restantes'};o.v+=r.v});
const fx=R.filter(r=>!r.pc&&/CONTA VIVO|NETFLIX|SPOTIFY|APPLE|GOOGLE|WELLHUB/.test(r.e.toUpperCase())).map(r=>({k:r.e,v:r.v,s:'mensal, sem fim definido'}));
const rec=[...Object.values(g),...fx].sort((a,b)=>b.v-a.v).slice(0,8),rm=rec[0]?rec[0].v:1;
const recH=rec.map(o=>`<div class='br'><span>${o.k}<small>${o.s}</small></span><span class='bt'><i style='width:${o.v/rm*100}%;background:var(--acc)'></i></span><span class='bv'>${f(o.v)}</span></div>`).join('');
const pb=(l,a,t,col)=>`<div class='br'><span>${l}</span><span class='bt'><i style='width:${a/t*100}%;background:${col}'></i></span><span class='bv'>${pc(a,t)} parcelado</span></div>`;
const top=a=>'<ul>'+a.slice().sort((x,y)=>y.v-x.v).slice(0,5).map(r=>`<li>${r.e}: <b>${f(r.v)}</b></li>`).join('')+'</ul>';
const tN=by(Nr)[0]||['sem gastos',0],tP=by(Pr)[0]||['sem gastos',0],mk=all.find(x=>x[0].startsWith('Mercado')),fd=S(R.filter(r=>/^Delivery|^Bar/.test(r.c)));
const sm=R.filter(r=>r.v>0&&r.v<50&&!r.pc),big=R.slice().sort((a,b)=>b.v-a.v)[0];
const ins=[
`Natália concentra o gasto em <b>${tN[0]}</b>: ${f(tN[1])}, ${pc(tN[1],N)} da fatura dela.`,
`Paulo concentra o gasto em <b>${tP[0]}</b>: ${f(tP[1])}, ${pc(tP[1],P)} da fatura dele.`,
`${pc(pv,T)} da fatura (${f(pv)}) está parcelada. Há ${f(fut)} em parcelas futuras já comprometidas, sem contar compras novas.`,
`Entraram ${nw.length} parcelamentos novos nesta fatura, somando ${f(S(nw))} por mês. Parcelar compras pequenas mantém a fatura alta.`,
mk?`Mercado, padaria e afins somam ${f(mk[1])} (${pc(mk[1],T)}), em ${R.filter(r=>r.c===mk[0]).length} compras. Concentrar em uma compra semanal tende a reduzir esse valor.`:'',
`Delivery, restaurantes e bar somam ${f(fd)} (${pc(fd,T)} da fatura).`,
`${sm.length} compras à vista abaixo de R$ 50 somam ${f(S(sm))}: gastos pequenos que passam despercebidos.`,
rec[0]?`O maior gasto recorrente é <b>${rec[0].k}</b>: ${f(rec[0].v)} por mês (${rec[0].s}).`:'',
`A maior compra única foi <b>${big.e}</b>, ${f(big.v)}.`].filter(Boolean);
document.getElementById('dash').innerHTML=`<div class='kpis'><div class='kpi'><span>Total da fatura</span><b>${f(T)}</b></div><div class='kpi'><span>Paulo (${pc(P,T)})</span><b>${f(P)}</b></div><div class='kpi'><span>Natália (${pc(N,T)})</span><b>${f(N)}</b></div><div class='kpi'><span>Parcelado (${pc(pv,T)})</span><b>${f(pv)}</b></div></div>
<div class='grid'><div class='card full'><h2>Gasto por categoria e pessoa</h2><div class='leg'><i style='background:var(--acc)'></i>Paulo<i style='background:var(--n)'></i>Natália</div>${stack}</div>
<div class='card'><h2>Onde a Natália mais gasta</h2>${one(by(Nr).slice(0,6),'var(--n)')}</div>
<div class='card'><h2>Onde o Paulo mais gasta</h2>${one(by(Pr).slice(0,6),'var(--acc)')}</div>
<div class='card full'><h2>Maiores gastos recorrentes</h2>${recH}</div>
<div class='card'><h2>Parcelado por pessoa</h2>${pb('Paulo',pP,P,'var(--acc)')}${pb('Natália',pN,N,'var(--n)')}</div>
<div class='card'><h2>Maiores lançamentos</h2><b>Natália</b>${top(Nr)}<b>Paulo</b>${top(Pr)}</div>
<div class='card full'><h2>Insights</h2><ul>${ins.map(t=>`<li>${t}</li>`).join('')}</ul></div></div>`;
}

const RL=[['Mercado/supermercado/padaria','CARREFOUR|COOP|CONFIANCA|SUPERMERC|MERCADO RASGA|MINIMARKET|TAUSTE|DOMA|AMERICA SUPER|PADARIA|PADOCA|PANIFIC|SEARA|CASA DE CARNES|COLO DE MAE|SUPER SHOPPING|TRI.GO'],['Cursos e Cultura','CIRANDA|ASAAS|HOTMART'],['Despesas Diversas','DEEP MUSIC'],['Delivery, restaurantes e lanches','99FOOD|IFD|MARSALA|ESFIHA|MC DONALDS|CUPIM|OCA BURGER|CHURROS|ESPETINHO|KAISHI|LOSJEFES|PAOEBRASA|CACAU|JIM.COM|JOSEDEALCANTARA|LUZIALUCIA|FABIANA|MARIA DE LURDES|GABRIELIBANHES|RENATO|JOSE ROBERTO|VALDEMARIN|BROTHERS'],['Bar/cerveja','CERVEJ|MB CERV'],['Assinaturas digitais','NETFLIX|SPOTIFY|APPLE|GOOGLE|DIETAAI'],['Academia','ACADEMIA|WELLHUB'],['Saúde, farmácia e vacinas','REMEDIO|DROGARIA|DROHGARIA|CLINICA'],['Telefonia e contas','VIVO|FLEXPAG'],['Transporte/combustível','99 RIDE|UBER|AUTO POSTO|VELOE|MOTONET|MERCADOCAR|99PAYPAULO'],['Compras online','SHOPEE|MERCADOLIVRE|AMAZON|TIKTOK|SHEIN|LOJA CHINESA|99 *99PAY'],['Casa/utilidades','DAISO|SEISHO|ELECTROLUX|MARAVILHAS|ARTHUR|ESTRELA DO LAR|MAGALU|IKESAKI|EXPLOSAO|IMPERIO|LOUMAR|FABRISPUMA|SHOP IGUATEMI'],['Roupas, beleza e filhos','STUDIO|PERNAMBUCANAS|CARTERS|ALO BEBE|LOTUS|LOJAS G|KOALA|BABY GYM'],['Lazer/viagem','CATARATAS|ESPACO DAS AMERICAS|RIOS DA AMAZONIA']];
function cls(e){e=e.toUpperCase();for(const [n,k] of RL)if(k.split('|').some(x=>e.includes(x)))return n;return 'Seguro e outros'}
function parse(t){if(t.charCodeAt(0)===0xFEFF)t=t.slice(1);const L=t.split('\n').filter(x=>x.trim()),out=[],unk=[];
L.slice(1).forEach(l=>{const c=l.split(';').map(s=>s.trim().split('"').join(''));if(c.length<4)return;const e=c[1].split(' ').filter(Boolean).join(' ');if(e.toLowerCase().includes('pagamento'))return;
const v=parseFloat(c[3].replace(/[^0-9,-]/g,'').replace(',','.'));if(isNaN(v))return;
let p=/PAULO/i.test(c[2])?'P':/NATALIA/i.test(c[2])?'N':null;if(!p){if(!unk.includes(c[2]))unk.push(c[2]);p=unk.indexOf(c[2])===0?'P':'N'}
const pc=(c[4]||'').trim();out.push([cls(e),c[0].slice(0,5),e,p,Math.round(v*100)/100,pc==='-'?'':pc])});return out}
document.getElementById('csv').onchange=ev=>{const fl=ev.target.files[0];if(!fl)return;const rd=new FileReader();rd.onload=()=>{const r=parse(String(rd.result)),m=document.getElementById('imsg');
if(!r.length){m.textContent='Não encontrei lançamentos. Use o formato Data;Estabelecimento;Portador;Valor;Parcela.';return}
D=r;ov={};try{localStorage.setItem('imp',JSON.stringify(r));localStorage.setItem('impn',fl.name)}catch(e){}sv();
document.getElementById('ttl').textContent='Fatura importada: '+fl.name;m.textContent=r.length+' lançamentos importados, total '+f(r.reduce((s,x)=>s+x[4],0))+'.';render()};rd.readAsText(fl,'utf-8');ev.target.value=''};
document.getElementById('orig').onclick=()=>{D=D0;ov={};try{localStorage.removeItem('imp');localStorage.removeItem('impn')}catch(e){}sv();document.getElementById('ttl').textContent='Fatura de 20/10/2026';document.getElementById('imsg').textContent='';render()};
try{const n=localStorage.getItem('impn');if(n&&D!==D0)document.getElementById('ttl').textContent='Fatura importada: '+n}catch(e){}
